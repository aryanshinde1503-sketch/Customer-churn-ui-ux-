# Application Configuration
spring.application.name=Customer Churn Prediction System
server.port=8081

# H2 Database Configuration
spring.datasource.url=jdbc:h2:mem:churndb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# H2 Console (accessible at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=never

# Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# Logging
logging.level.com.churnprediction=INFO
logging.level.org.hibernate.SQL=WARN

# Application Custom Properties
app.prediction.threshold.low=0.40
app.prediction.threshold.medium=0.70
app.prediction.demo.label=DEMONSTRATION ESTIMATE
app.version=1.0.0
