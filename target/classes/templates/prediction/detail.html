<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prediction Detail | ChurnGuard Pro</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <style>.toast-item{display:flex;align-items:center;gap:10px;padding:12px 16px;border-radius:8px;background:#1e293b;color:#f1f5f9;font-size:13.5px;font-weight:500;box-shadow:0 10px 15px -3px rgba(0,0,0,.2);opacity:0;transform:translateX(100%);transition:all .3s ease;max-width:360px;}.toast-item.show{opacity:1;transform:translateX(0);}.toast-close{background:transparent;border:none;color:#94a3b8;cursor:pointer;font-size:16px;padding:0;}</style>
</head>
<body>
<div class="app-wrapper">
    <div th:replace="~{fragments/layout :: sidebar('history')}"></div>
    <div class="main-content" id="mainContent">
        <div th:replace="~{fragments/layout :: topbar('Prediction Detail')}"></div>

        <div class="page-content fade-in">
            <div class="page-header">
                <div class="d-flex align-items-center justify-content-between flex-wrap gap-12">
                    <div>
                        <h1 class="page-title">Prediction #<span th:text="${prediction.id}">0</span></h1>
                        <p class="page-subtitle" th:text="'For: ' + ${prediction.customer.fullName}">Customer</p>
                    </div>
                    <a th:href="@{/predictions/history}" class="btn btn-secondary">
                        <i class="bi bi-arrow-left"></i> Back to History
                    </a>
                </div>
            </div>

            <div class="row cols-2 g-20">
                <div class="card">
                    <div class="card-header"><span class="card-title">Result</span></div>
                    <div class="card-body" style="text-align:center;padding:32px;">
                        <div class="risk-score-circle"
                             th:classappend="${prediction.riskCategory.name() == 'HIGH'} ? 'high' : (${prediction.riskCategory.name() == 'MEDIUM'} ? 'medium' : 'low')">
                            <div class="risk-percent"
                                 th:classappend="${prediction.riskCategory.name() == 'HIGH'} ? 'high' : (${prediction.riskCategory.name() == 'MEDIUM'} ? 'medium' : 'low')"
                                 th:text="${prediction.probabilityPercent} + '%'">0%</div>
                            <div class="risk-label" th:text="${prediction.riskCategory} + ' RISK'">Risk</div>
                        </div>
                        <div style="margin-top:20px;">
                            <span class="badge badge-demo">Prediction Method: <span th:text="${prediction.predictionMethod.label}">Demo</span></span>
                        </div>
                        <div th:if="${prediction.notes}" style="margin-top:16px;text-align:left;color:var(--text-secondary);font-size:13px;padding:12px;background:var(--bg);border-radius:8px;">
                            <strong>Notes:</strong> <span th:text="${prediction.notes}">notes</span>
                        </div>
                    </div>
                </div>

                <div class="card">
                    <div class="card-header"><span class="card-title">Customer Information</span></div>
                    <div class="card-body" style="display:flex;flex-direction:column;gap:12px;">
                        <div class="detail-item">
                            <span class="detail-label">Customer Name</span>
                            <a th:href="@{/customers/{id}(id=${prediction.customer.id})}"
                               class="detail-value" th:text="${prediction.customer.fullName}">Name</a>
                        </div>
                        <div class="detail-item">
                            <span class="detail-label">Customer ID</span>
                            <span class="detail-value" th:text="${prediction.customer.customerId}">ID</span>
                        </div>
                        <div class="detail-item">
                            <span class="detail-label">Contract Type</span>
                            <span class="detail-value" th:text="${#strings.replace(prediction.customer.contract.name(),'_',' ')}">Contract</span>
                        </div>
                        <div class="detail-item">
                            <span class="detail-label">Tenure</span>
                            <span class="detail-value" th:text="${prediction.customer.tenure} + ' months'">0</span>
                        </div>
                        <div class="detail-item">
                            <span class="detail-label">Monthly Charges</span>
                            <span class="detail-value fw-700" th:text="'$' + ${#numbers.formatDecimal(prediction.customer.monthlyCharges,1,2)}">$0</span>
                        </div>
                        <div class="detail-item">
                            <span class="detail-label">Prediction Date</span>
                            <span class="detail-value" th:text="${#temporals.format(prediction.createdAt,'MMM d, yyyy HH:mm:ss')}">Date</span>
                        </div>
                        <div style="margin-top:8px;">
                            <a th:href="@{/customers/{id}(id=${prediction.customer.id})}" class="btn btn-outline-primary" style="width:100%;justify-content:center;">
                                <i class="bi bi-person"></i> View Full Customer Profile
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div th:replace="~{fragments/layout :: footer}"></div>
    </div>
</div>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
