<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error | ChurnGuard Pro</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div class="app-wrapper">
    <div th:replace="~{fragments/layout :: sidebar('dashboard')}"></div>
    <div class="main-content" id="mainContent">
        <div th:replace="~{fragments/layout :: topbar('Error')}"></div>

        <div class="page-content fade-in">
            <div style="max-width:560px;margin:60px auto;text-align:center;">
                <div class="card" style="padding:40px 24px;">
                    <div style="width:72px;height:72px;border-radius:50%;background:#fee2e2;color:#ef4444;display:flex;align-items:center;justify-content:center;margin:0 auto 20px;font-size:32px;">
                        <i class="bi bi-exclamation-triangle-fill"></i>
                    </div>
                    <h2 class="fw-700" style="font-size:24px;margin-bottom:8px;" th:text="${errorTitle ?: 'System Error'}">An Error Occurred</h2>
                    <p style="color:var(--text-secondary);font-size:14px;margin-bottom:24px;" th:text="${errorMessage ?: 'The requested resource could not be found or processed.'}">
                        Details of the error will be displayed here.
                    </p>
                    <div class="d-flex justify-content-center gap-12">
                        <a href="javascript:history.back()" class="btn btn-secondary">
                            <i class="bi bi-arrow-left"></i> Go Back
                        </a>
                        <a th:href="@{/dashboard}" class="btn btn-primary">
                            <i class="bi bi-grid-fill"></i> Dashboard
                        </a>
                    </div>
                </div>
            </div>
        </div>

        <div th:replace="~{fragments/layout :: footer}"></div>
    </div>
</div>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
