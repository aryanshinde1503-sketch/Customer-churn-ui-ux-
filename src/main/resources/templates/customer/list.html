<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customers | ChurnGuard Pro</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <style>
        .toast-item{display:flex;align-items:center;gap:10px;padding:12px 16px;border-radius:8px;background:#1e293b;color:#f1f5f9;font-size:13.5px;font-weight:500;box-shadow:0 10px 15px -3px rgba(0,0,0,.2);opacity:0;transform:translateX(100%);transition:all .3s ease;max-width:360px;}
        .toast-item.show{opacity:1;transform:translateX(0);}
        .toast-item.toast-success{border-left:4px solid #10b981;}.toast-item.toast-danger{border-left:4px solid #ef4444;}
        .toast-item i:first-child{font-size:16px;flex-shrink:0;}.toast-item span{flex:1;}.toast-close{background:transparent;border:none;color:#94a3b8;cursor:pointer;font-size:16px;padding:0;}
        .toast-item.toast-success i:first-child{color:#10b981;}.toast-item.toast-danger i:first-child{color:#ef4444;}
    </style>
</head>
<body>
<div class="app-wrapper">
    <div th:replace="~{fragments/layout :: sidebar('customers')}"></div>
    <div class="main-content" id="mainContent">
        <div th:replace="~{fragments/layout :: topbar('Customer Management')}"></div>
        <div class="page-content fade-in">

            <!-- Flash -->
            <div th:if="${successMessage}" class="alert alert-success alert-auto-dismiss">
                <i class="bi bi-check-circle-fill"></i><span th:text="${successMessage}"></span>
            </div>
            <div th:if="${errorMessage}" class="alert alert-danger alert-auto-dismiss">
                <i class="bi bi-x-circle-fill"></i><span th:text="${errorMessage}"></span>
            </div>

            <!-- Header -->
            <div class="page-header">
                <div class="d-flex align-items-center justify-content-between flex-wrap gap-12">
                    <div>
                        <h1 class="page-title">Customer Management</h1>
                        <p class="page-subtitle">
                            Showing <strong th:text="${customers.totalElements}">0</strong> customers
                            &bull; <strong th:text="${churnedCustomers}">0</strong> churned
                        </p>
                    </div>
                    <a th:href="@{/customers/new}" class="btn btn-primary">
                        <i class="bi bi-person-plus-fill"></i> Add Customer
                    </a>
                </div>
            </div>

            <!-- Filters -->
            <div class="table-container">
                <div class="table-header" style="flex-wrap:wrap;gap:12px;">
                    <form th:action="@{/customers}" method="get" class="d-flex flex-wrap gap-8" style="flex:1;align-items:center;">
                        <div class="search-box">
                            <i class="bi bi-search search-icon"></i>
                            <input type="text" name="search" class="form-control"
                                   th:value="${search}" placeholder="Search customers..."
                                   oninput="debounceSearch(this)">
                        </div>
                        <select name="churnStatus" class="form-select" style="width:auto;min-width:130px;"
                                onchange="this.form.submit()">
                            <option value="">All Status</option>
                            <option value="false" th:selected="${churnStatus == false}">Active</option>
                            <option value="true" th:selected="${churnStatus == true}">Churned</option>
                        </select>
                        <select name="contract" class="form-select" style="width:auto;min-width:160px;"
                                onchange="this.form.submit()">
                            <option value="">All Contracts</option>
                            <option th:each="c : ${contracts}" th:value="${c}" th:text="${#strings.replace(c.name(),'_',' ')}"
                                    th:selected="${c == contract}">Contract</option>
                        </select>
                        <select name="internetService" class="form-select" style="width:auto;min-width:160px;"
                                onchange="this.form.submit()">
                            <option value="">All Internet</option>
                            <option th:each="s : ${internetServices}" th:value="${s}"
                                    th:text="${#strings.replace(s.name(),'_',' ')}"
                                    th:selected="${s == internetService}">Service</option>
                        </select>
                        <input type="hidden" name="sortBy" th:value="${sortBy}">
                        <input type="hidden" name="sortDir" th:value="${sortDir}">
                    </form>
                </div>

                <div style="overflow-x:auto;">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th><a th:href="@{/customers(sortBy='customerId',sortDir=${sortBy == 'customerId' ? reverseSortDir : 'asc'},search=${search},churnStatus=${churnStatus},contract=${contract})}">
                                    ID <i th:class="${sortBy == 'customerId'} ? ('bi bi-chevron-' + (sortDir == 'asc' ? 'up' : 'down')) : 'bi bi-chevron-expand'" style="font-size:10px;"></i>
                                </a></th>
                                <th><a th:href="@{/customers(sortBy='firstName',sortDir=${sortBy == 'firstName' ? reverseSortDir : 'asc'},search=${search},churnStatus=${churnStatus},contract=${contract})}">
                                    Name <i th:class="${sortBy == 'firstName'} ? ('bi bi-chevron-' + (sortDir == 'asc' ? 'up' : 'down')) : 'bi bi-chevron-expand'" style="font-size:10px;"></i>
                                </a></th>
                                <th>Contract</th>
                                <th><a th:href="@{/customers(sortBy='tenure',sortDir=${sortBy == 'tenure' ? reverseSortDir : 'asc'},search=${search},churnStatus=${churnStatus},contract=${contract})}">
                                    Tenure <i th:class="${sortBy == 'tenure'} ? ('bi bi-chevron-' + (sortDir == 'asc' ? 'up' : 'down')) : 'bi bi-chevron-expand'" style="font-size:10px;"></i>
                                </a></th>
                                <th>Internet</th>
                                <th><a th:href="@{/customers(sortBy='monthlyCharges',sortDir=${sortBy == 'monthlyCharges' ? reverseSortDir : 'asc'},search=${search},churnStatus=${churnStatus},contract=${contract})}">
                                    Monthly $ <i th:class="${sortBy == 'monthlyCharges'} ? ('bi bi-chevron-' + (sortDir == 'asc' ? 'up' : 'down')) : 'bi bi-chevron-expand'" style="font-size:10px;"></i>
                                </a></th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="c : ${customers}" th:data-href="@{/customers/{id}(id=${c.id})}">
                                <td>
                                    <span class="fw-600" style="font-size:12px;color:var(--text-muted);" th:text="${c.customerId}">ID</span>
                                    <span th:if="${c.isDemoData}" class="badge badge-demo" style="font-size:9px;margin-left:4px;">Demo</span>
                                </td>
                                <td>
                                    <div class="d-flex align-items-center gap-8">
                                        <div class="avatar" style="width:32px;height:32px;font-size:11px;"
                                             th:text="${#strings.substring(c.firstName,0,1) + #strings.substring(c.lastName,0,1)}">AB</div>
                                        <div>
                                            <div class="fw-600" th:text="${c.fullName}">Name</div>
                                            <div style="font-size:11px;color:var(--text-muted);" th:text="${c.email ?: '—'}">email</div>
                                        </div>
                                    </div>
                                </td>
                                <td>
                                    <span class="badge"
                                          th:classappend="${c.contract.name() == 'MONTH_TO_MONTH'} ? 'badge-warning' : (${c.contract.name() == 'TWO_YEAR'} ? 'badge-success' : 'badge-info')"
                                          th:text="${#strings.replace(c.contract.name(),'_',' ')}">Contract</span>
                                </td>
                                <td th:text="${c.tenure} + ' mo'">0</td>
                                <td>
                                    <span th:text="${#strings.replace(c.internetService.name(),'_',' ')}">Internet</span>
                                </td>
                                <td th:text="'$' + ${#numbers.formatDecimal(c.monthlyCharges,1,2)}">$0</td>
                                <td>
                                    <span th:if="${c.churnStatus}" class="badge badge-danger"><i class="bi bi-x-circle"></i> Churned</span>
                                    <span th:unless="${c.churnStatus}" class="badge badge-success"><i class="bi bi-check-circle"></i> Active</span>
                                </td>
                                <td>
                                    <div class="d-flex gap-8">
                                        <a th:href="@{/customers/{id}(id=${c.id})}" class="btn btn-icon btn-sm" title="View">
                                            <i class="bi bi-eye"></i>
                                        </a>
                                        <a th:href="@{/customers/{id}/edit(id=${c.id})}" class="btn btn-icon btn-sm" title="Edit">
                                            <i class="bi bi-pencil"></i>
                                        </a>
                                        <a th:href="@{/predictions/new(customerId=${c.id})}" class="btn btn-icon btn-sm text-primary-color" title="Predict">
                                            <i class="bi bi-cpu"></i>
                                        </a>
                                        <form th:action="@{/customers/{id}/delete(id=${c.id})}" method="post" th:id="'del-' + ${c.id}">
                                            <button type="button" class="btn btn-icon btn-sm text-danger-color"
                                                    th:data-target="'del-' + ${c.id}"
                                                    th:data-name="${c.fullName}"
                                                    onclick="confirmDelete(this.getAttribute('data-target'), this.getAttribute('data-name'))">
                                                <i class="bi bi-trash"></i>
                                            </button>
                                        </form>
                                    </div>
                                </td>
                            </tr>
                            <tr th:if="${customers.totalElements == 0}">
                                <td colspan="8" style="text-align:center;padding:40px;color:var(--text-muted);">
                                    <i class="bi bi-inbox" style="font-size:32px;display:block;margin-bottom:8px;"></i>
                                    No customers found. <a th:href="@{/customers/new}">Add one?</a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <!-- Pagination -->
                <div style="padding:16px 20px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;border-top:1px solid var(--border);">
                    <span style="font-size:13px;color:var(--text-muted);">
                        Page <strong th:text="${customers.number + 1}">1</strong> of
                        <strong th:text="${customers.totalPages > 0 ? customers.totalPages : 1}">1</strong>
                    </span>
                    <ul class="pagination">
                        <li class="page-item" th:classappend="${customers.first} ? 'disabled'">
                            <a class="page-link" th:href="@{/customers(page=${customers.number - 1},size=${customers.size},search=${search},sortBy=${sortBy},sortDir=${sortDir},churnStatus=${churnStatus},contract=${contract})}">
                                <i class="bi bi-chevron-left"></i>
                            </a>
                        </li>
                        <li class="page-item" th:each="i : ${#numbers.sequence(0, customers.totalPages - 1)}"
                            th:if="${i >= customers.number - 2 and i <= customers.number + 2}"
                            th:classappend="${i == customers.number} ? 'active'">
                            <a class="page-link" th:text="${i + 1}"
                               th:href="@{/customers(page=${i},size=${customers.size},search=${search},sortBy=${sortBy},sortDir=${sortDir},churnStatus=${churnStatus},contract=${contract})}">1</a>
                        </li>
                        <li class="page-item" th:classappend="${customers.last} ? 'disabled'">
                            <a class="page-link" th:href="@{/customers(page=${customers.number + 1},size=${customers.size},search=${search},sortBy=${sortBy},sortDir=${sortDir},churnStatus=${churnStatus},contract=${contract})}">
                                <i class="bi bi-chevron-right"></i>
                            </a>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
        <div th:replace="~{fragments/layout :: footer}"></div>
    </div>
</div>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
